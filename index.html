<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0710" />
    <meta name="description" content="Медвежий Рыцарь — дарк-фэнтези платформер с прокачкой, лутом и магазином." />
    <title>Медвежий Рыцарь: Тьма Севера</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="game"></canvas>

        <button id="pause-btn" type="button" aria-label="Пауза">
          <span></span><span></span>
        </button>

        <div id="banner" class="banner"></div>

        <div class="touch-dock">
          <div class="touch touch--left">
            <button class="tbtn tbtn--dir" data-action="left" aria-label="Влево">◄</button>
            <button class="tbtn tbtn--dir" data-action="down" aria-label="Вниз">▼</button>
            <button class="tbtn tbtn--dir" data-action="right" aria-label="Вправо">►</button>
          </div>

          <div class="touch touch--right">
            <div class="touch-row">
              <button class="tbtn tbtn--sm" data-action="roar" aria-label="Рёв">☗</button>
              <button class="tbtn tbtn--sm" data-action="bolt" aria-label="Сгусток">✷</button>
              <button class="tbtn tbtn--sm" data-action="potion" aria-label="Зелье">✚</button>
              <button class="tbtn tbtn--sm" data-action="interact" aria-label="Действие">F</button>
              <button class="tbtn tbtn--sm" data-action="dash" aria-label="Рывок">»</button>
            </div>
            <div class="touch-row">
              <button class="tbtn tbtn--md" data-action="heavy" aria-label="Тяжёлый удар">✦</button>
              <button class="tbtn tbtn--md tbtn--attack" data-action="attack" aria-label="Атака">⚔</button>
              <button class="tbtn tbtn--md tbtn--jump" data-action="jump" aria-label="Прыжок">▲</button>
            </div>
          </div>
        </div>
      </div>

      <div id="overlay" class="overlay hidden"></div>

      <div id="boot">
        <div class="boot-mark"></div>
        <p>Разжигаем костёр…</p>
      </div>
    </div>

    <script src="src/main.js" type="module"></script>
  </body>
</html>
